name: Generate JOSHING132 Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate red snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JOSHING132
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff1e1e&color_dots=%23000000,%23100000,%23400000,%23900000,%23ff1e1e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff1e1e&color_dots=%23000000,%23100000,%23400000,%23900000,%23ff1e1e

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
