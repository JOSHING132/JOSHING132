name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate red snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JOSHING132
          outputs: |
            profile/snake.svg?color_snake=%23ff2a2a&color_dots=%230d1117,%23210d0d,%23520f0f,%23911a1a,%23ff2a2a

      - name: Commit updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/snake.svg

          if git diff --cached --quiet; then
            echo "Snake is already up to date."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push
