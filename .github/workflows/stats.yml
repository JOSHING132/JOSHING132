name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-statistics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=JOSHING132&show_icons=true&hide_border=true&bg_color=0D1117&title_color=FF2A2A&text_color=C9D1D9&icon_color=FF2A2A&ring_color=FF2A2A&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=JOSHING132&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=FF2A2A&text_color=C9D1D9
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/languages.svg

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi

          git commit -m "Update GitHub statistics"
          git push
