name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-statistics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=JOSHING132
            &show_icons=true
            &theme=radical
            &hide_border=true
            &include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=JOSHING132
            &layout=compact
            &theme=radical
            &hide_border=true
            &langs_count=8
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi

          git commit -m "Update GitHub statistics"
          git push
